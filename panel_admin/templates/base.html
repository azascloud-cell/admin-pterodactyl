<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PteroShop Admin{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --bg:     #0d0d1a;
      --card:   #13132a;
      --card2:  #1a1a35;
      --border: #2a2a4a;
      --accent: #7c6cfc;
      --accent2:#5a4fcf;
      --teal:   #00d4aa;
      --text:   #e0e0f0;
      --muted:  #8080a0;
    }
    body            { background:var(--bg); color:var(--text); font-family:'Segoe UI',sans-serif; min-height:100vh; }
    .sidebar        { width:240px; min-height:100vh; background:var(--card); border-right:1px solid var(--border); position:fixed; top:0; left:0; z-index:100; }
    .sidebar .brand { padding:20px 18px 12px; font-size:1.15rem; font-weight:700; color:#fff; border-bottom:1px solid var(--border); }
    .sidebar .brand span { color:var(--accent); }
    .sidebar .nav-link { color:var(--muted); padding:10px 18px; display:flex; align-items:center; gap:10px; border-radius:8px; margin:2px 8px; transition:.15s; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { background:var(--card2); color:#fff; }
    .sidebar .nav-link i { font-size:1.1rem; width:20px; }
    .main-content   { margin-left:240px; padding:28px; }
    .topbar         { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 20px; margin-bottom:24px; display:flex; align-items:center; justify-content:space-between; }
    .stat-card      { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:22px; height:100%; }
    .stat-icon      { width:48px; height:48px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.4rem; }
    .card-custom    { background:var(--card); border:1px solid var(--border); border-radius:14px; }
    .card-custom .card-header { background:var(--card2); border-bottom:1px solid var(--border); border-radius:14px 14px 0 0; padding:14px 20px; }
    .table          { color:var(--text); }
    .table-dark     { --bs-table-bg: var(--card); --bs-table-striped-bg: var(--card2); --bs-table-border-color: var(--border); }
    .badge-pending  { background:#f7b731; color:#000; }
    .badge-paid     { background:var(--teal); color:#000; }
    .badge-expired  { background:#555; color:#ccc; }
    .btn-accent     { background:var(--accent); border:none; color:#fff; }
    .btn-accent:hover { background:var(--accent2); color:#fff; }
    .form-control, .form-select { background:var(--card2); border:1px solid var(--border); color:var(--text); }
    .form-control:focus, .form-select:focus { background:var(--card2); color:var(--text); border-color:var(--accent); box-shadow:0 0 0 2px rgba(124,108,252,.25); }
    .alert          { border-radius:10px; }
  </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar d-flex flex-column">
  <div class="brand">🦕 <span>Ptero</span>Shop</div>
  <nav class="mt-2 flex-grow-1">
    <a href="{{ url_for('dashboard') }}" class="nav-link {% if request.endpoint=='dashboard' %}active{% endif %}">
      <i class="bi bi-speedometer2"></i> Dashboard
    </a>
    <a href="{{ url_for('orders') }}" class="nav-link {% if 'order' in request.endpoint %}active{% endif %}">
      <i class="bi bi-receipt"></i> Pesanan
    </a>
    <a href="{{ url_for('products') }}" class="nav-link {% if 'product' in request.endpoint %}active{% endif %}">
      <i class="bi bi-box-seam"></i> Produk
    </a>
    <a href="{{ url_for('users') }}" class="nav-link {% if request.endpoint=='users' %}active{% endif %}">
      <i class="bi bi-people"></i> Pelanggan
    </a>
    <a href="{{ url_for('config') }}" class="nav-link {% if request.endpoint=='config' %}active{% endif %}">
      <i class="bi bi-gear"></i> Konfigurasi
    </a>
  </nav>
  <div class="p-3 border-top" style="border-color:var(--border)!important;">
    <a href="{{ url_for('logout') }}" class="nav-link text-danger">
      <i class="bi bi-box-arrow-left"></i> Logout
    </a>
  </div>
</div>

<!-- Main -->
<div class="main-content">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
