<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — PteroShop Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#0d0d1a; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .login-box { background:#13132a; border:1px solid #2a2a4a; border-radius:18px; padding:40px 36px; width:100%; max-width:400px; }
    .login-box h2 { color:#fff; margin-bottom:6px; }
    .login-box p  { color:#8080a0; font-size:.9rem; margin-bottom:28px; }
    .form-control { background:#1a1a35; border:1px solid #2a2a4a; color:#e0e0f0; }
    .form-control:focus { background:#1a1a35; color:#e0e0f0; border-color:#7c6cfc; box-shadow:0 0 0 2px rgba(124,108,252,.25); }
    .form-label { color:#a0a0c0; font-size:.85rem; }
    .btn-login { background:#7c6cfc; border:none; width:100%; padding:11px; font-weight:600; letter-spacing:.4px; }
    .btn-login:hover { background:#5a4fcf; }
    .alert { font-size:.88rem; border-radius:10px; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>🦕 PteroShop</h2>
    <p>Admin Panel — masuk untuk lanjut</p>

    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="admin" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-login text-white">Masuk</button>
    </form>
  </div>
</body>
</html>
