name: 💓 Keep Alive — Auto Restart Panel

on:
  # ── Restart otomatis setiap 5 jam 30 menit (sebelum panel-runner kehabisan waktu) ──
  schedule:
    - cron: '0 */5 * * *'

  # ── Ping eksternal (UptimeRobot, cron-job.org, dll) ──────────────────────
  repository_dispatch:
    types: [keepalive-ping, ping, heartbeat, start-panel]

  # ── Manual ────────────────────────────────────────────────────────────────
  workflow_dispatch:

jobs:
  restart-panel:
    name: 🔄 Restart Panel Runner
    runs-on: ubuntu-latest
    steps:
      - name: Trigger panel-runner workflow
        run: |
          echo "⏰ $(date -u '+%Y-%m-%d %H:%M:%S UTC') — Triggering panel restart..."

          RESPONSE=$(curl -s -w "\nHTTP:%{http_code}" -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT || github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/panel-runner.yml/dispatches" \
            -d '{"ref":"main"}')

          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP:" | cut -d: -f2)
          echo "GitHub API response: HTTP $HTTP_CODE"

          if [ "$HTTP_CODE" = "204" ]; then
            echo "✅ Panel runner triggered successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Trigger response: $HTTP_CODE" >> $GITHUB_STEP_SUMMARY
            echo "$RESPONSE"
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🕐 Triggered at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "📍 Repository: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
