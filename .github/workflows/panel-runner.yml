name: 🦕 Pterodactyl Panel — Personal

on:
  schedule:
    - cron: '0 */5 * * *'   # Auto-restart setiap 5 jam

  workflow_dispatch:
    inputs:
      fresh_install:
        description: 'Reset database (fresh install)?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

  repository_dispatch:
    types: [start-panel, keepalive-ping, ping]

jobs:
  run-panel:
    name: 🖥️ Run Panel
    runs-on: ubuntu-22.04
    timeout-minutes: 350   # ~5 jam 50 menit

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: 📦 Checkout
        uses: actions/checkout@v4

      # ── 2. Restore state ──────────────────────────────────────────────────
      - name: 🗄️ Restore Panel State
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/panel-state/db.sql.gz
            /tmp/panel-state/.env
            /tmp/panel-state/app_key.txt
          key: pterodactyl-panel-state-v1
          restore-keys: pterodactyl-panel-state-

      - name: 📋 Check state
        run: |
          FRESH="${{ github.event.inputs.fresh_install || 'false' }}"
          if [ -f /tmp/panel-state/db.sql.gz ] && [ "$FRESH" != "true" ]; then
            echo "STATE=restore" >> $GITHUB_ENV
            echo "✅ Previous state found — restoring"
          else
            echo "STATE=fresh" >> $GITHUB_ENV
            echo "🆕 Fresh installation"
          fi
          mkdir -p /tmp/panel-state

      # ── 3. Install system packages ────────────────────────────────────────
      - name: ⚡ Install Packages
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y -qq software-properties-common
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            nginx mariadb-server redis-server supervisor \
            php8.2 php8.2-cli php8.2-gd php8.2-mysql php8.2-pdo \
            php8.2-mbstring php8.2-tokenizer php8.2-bcmath \
            php8.2-xml php8.2-fpm php8.2-curl php8.2-zip \
            curl wget unzip cron 2>&1 | tail -5
          curl -sS https://getcomposer.org/installer | sudo php -- --install-dir=/usr/local/bin --filename=composer
          echo "✅ PHP $(php8.2 --version | head -1 | cut -d' ' -f2)"

      # ── 4. MariaDB ────────────────────────────────────────────────────────
      - name: 🗃️ Configure MariaDB
        run: |
          sudo systemctl start mariadb
          sudo mysql -u root <<SQL
          CREATE DATABASE IF NOT EXISTS panel CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE USER IF NOT EXISTS 'pterodactyl'@'127.0.0.1' IDENTIFIED BY '${{ secrets.DB_PASSWORD }}';
          GRANT ALL PRIVILEGES ON panel.* TO 'pterodactyl'@'127.0.0.1';
          FLUSH PRIVILEGES;
          SQL
          echo "✅ Database ready"

      # ── 5. Download panel ─────────────────────────────────────────────────
      - name: 🦕 Setup Pterodactyl Panel
        run: |
          sudo mkdir -p /var/www/pterodactyl
          cd /var/www/pterodactyl
          LATEST=$(curl -s https://api.github.com/repos/pterodactyl/panel/releases/latest \
            | grep browser_download_url | grep panel.tar.gz | cut -d'"' -f4)
          sudo curl -Lo panel.tar.gz "$LATEST"
          sudo tar -xzf panel.tar.gz && sudo rm panel.tar.gz
          sudo chmod -R 755 storage bootstrap/cache
          sudo COMPOSER_ALLOW_SUPERUSER=1 composer install \
            --no-dev --optimize-autoloader --no-interaction -q
          echo "✅ Panel files ready"

      # ── 6. Environment ────────────────────────────────────────────────────
      - name: ⚙️ Configure Environment
        run: |
          cd /var/www/pterodactyl
          if [ "$STATE" = "restore" ] && [ -f /tmp/panel-state/.env ]; then
            echo "📂 Restoring .env from cache..."
            sudo cp /tmp/panel-state/.env .env
          else
            echo "🆕 Creating fresh .env..."
            sudo cp .env.example .env
            sudo php artisan key:generate --force
            APP_KEY=$(grep '^APP_KEY=' .env | cut -d'=' -f2-)
            mkdir -p /tmp/panel-state
            echo "$APP_KEY" > /tmp/panel-state/app_key.txt
          fi
          sudo sed -i "s|APP_URL=.*|APP_URL=http://localhost|"           .env
          sudo sed -i "s|APP_ENVIRONMENT=.*|APP_ENVIRONMENT=production|" .env
          sudo sed -i "s|APP_DEBUG=.*|APP_DEBUG=false|"                  .env
          sudo sed -i "s|DB_HOST=.*|DB_HOST=127.0.0.1|"                  .env
          sudo sed -i "s|DB_DATABASE=.*|DB_DATABASE=panel|"              .env
          sudo sed -i "s|DB_USERNAME=.*|DB_USERNAME=pterodactyl|"        .env
          sudo sed -i "s|DB_PASSWORD=.*|DB_PASSWORD=${{ secrets.DB_PASSWORD }}|" .env
          sudo sed -i "s|CACHE_DRIVER=.*|CACHE_DRIVER=file|"             .env
          sudo sed -i "s|SESSION_DRIVER=.*|SESSION_DRIVER=file|"         .env
          sudo sed -i "s|QUEUE_CONNECTION=.*|QUEUE_CONNECTION=sync|"     .env
          grep -q '^TRUSTED_PROXIES='      .env \
            && sudo sed -i "s|TRUSTED_PROXIES=.*|TRUSTED_PROXIES=*|"             .env \
            || echo "TRUSTED_PROXIES=*"            | sudo tee -a .env
          grep -q '^SESSION_SECURE_COOKIE=' .env \
            && sudo sed -i "s|SESSION_SECURE_COOKIE=.*|SESSION_SECURE_COOKIE=false|" .env \
            || echo "SESSION_SECURE_COOKIE=false"  | sudo tee -a .env
          grep -q '^RECAPTCHA_ENABLED='    .env \
            && sudo sed -i "s|RECAPTCHA_ENABLED=.*|RECAPTCHA_ENABLED=false|"    .env \
            || echo "RECAPTCHA_ENABLED=false"      | sudo tee -a .env
          echo "✅ .env configured"

      # ── 7. Database migrate + admin user ──────────────────────────────────
      - name: 🗄️ Setup Database
        run: |
          cd /var/www/pterodactyl
          if [ "$STATE" = "restore" ] && [ -f /tmp/panel-state/db.sql.gz ]; then
            echo "📂 Restoring database..."
            zcat /tmp/panel-state/db.sql.gz | sudo mysql -u root panel
            echo "🔄 Running pending migrations..."
            sudo php artisan migrate --force -q
          else
            echo "🆕 Fresh migrations..."
            sudo php artisan migrate --seed --force -q
          fi
          echo "✅ Database ready"

          # Sync admin user
          ADMIN_USER="${{ secrets.ADMIN_USER }}"
          ADMIN_PASS="${{ secrets.ADMIN_PASS }}"
          python3 "$GITHUB_WORKSPACE/scripts/sync_admin.py" \
            "${ADMIN_USER:-admin}" "${ADMIN_PASS:-admin}"

          # Force-reset password
          FINAL_PASS="${ADMIN_PASS:-admin}"
          python3 "$GITHUB_WORKSPACE/scripts/reset_password.py" "$FINAL_PASS"

      # ── 8. Import Node.js Egg ─────────────────────────────────────────────
      - name: 🟢 Import Node.js Egg
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/import_nodejs_egg.py"

      # ── 9. Services ───────────────────────────────────────────────────────
      - name: 🔧 Start Services
        run: |
          cd /var/www/pterodactyl
          sudo chown -R www-data:www-data /var/www/pterodactyl/
          sudo chmod -R 755 storage bootstrap/cache

          sudo tee /etc/supervisor/conf.d/ptero.conf > /dev/null <<CONF
          [program:ptero-worker]
          process_name=%(program_name)s_%(process_num)02d
          command=php /var/www/pterodactyl/artisan queue:work --sleep=3 --tries=3 --max-time=3600
          autostart=true
          autorestart=true
          user=www-data
          numprocs=2
          redirect_stderr=true
          stdout_logfile=/var/log/supervisor/ptero.log
          CONF

          sudo supervisorctl reread && sudo supervisorctl update
          sudo supervisorctl start ptero-worker:* 2>/dev/null || true

          echo "* * * * * www-data php /var/www/pterodactyl/artisan schedule:run" \
            | sudo tee /etc/cron.d/pterodactyl
          sudo systemctl restart cron
          sudo systemctl restart php8.2-fpm redis-server
          echo "✅ Services started"

      # ── 10. Bypass login /go-admin ────────────────────────────────────────
      - name: 🔓 Add Admin Bypass Route
        run: |
          sudo python3 "$GITHUB_WORKSPACE/scripts/add_bypass.py"
          cd /var/www/pterodactyl
          sudo php artisan route:clear  2>/dev/null || true
          sudo php artisan cache:clear  2>/dev/null || true
          echo "✅ Bypass /go-admin ready"

      # ── 11. Nginx ─────────────────────────────────────────────────────────
      - name: 🌐 Configure Nginx
        run: |
          sudo tee /etc/nginx/sites-available/pterodactyl > /dev/null <<NGINX
          server {
              listen 80 default_server;
              server_name _;
              root /var/www/pterodactyl/public;
              index index.php;
              client_max_body_size 100m;

              location / {
                  try_files \$uri \$uri/ /index.php?\$query_string;
              }
              location ~ \.php$ {
                  fastcgi_split_path_info ^(.+\.php)(/.+)$;
                  fastcgi_pass unix:/run/php/php8.2-fpm.sock;
                  fastcgi_index index.php;
                  include fastcgi_params;
                  fastcgi_param SCRIPT_FILENAME \$document_root\$fastcgi_script_name;
                  fastcgi_param HTTP_PROXY "";
                  fastcgi_param HTTPS on;
                  fastcgi_param HTTP_X_FORWARDED_PROTO https;
              }
              location ~ /\.ht { deny all; }
          }
          NGINX

          sudo ln -sf /etc/nginx/sites-available/pterodactyl \
                      /etc/nginx/sites-enabled/pterodactyl
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t && sudo systemctl restart nginx
          echo "✅ Nginx ready"

      # ── 12. Cloudflare Tunnel ─────────────────────────────────────────────
      - name: 🌍 Start Cloudflare Tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

          cloudflared tunnel --url http://localhost:80 --no-autoupdate \
            2>/tmp/cloudflared.log &

          echo "⏳ Waiting for tunnel URL..."
          for i in $(seq 1 30); do
            TUNNEL_URL=$(grep -oP 'https://[a-zA-Z0-9\-]+\.trycloudflare\.com' \
              /tmp/cloudflared.log 2>/dev/null | head -1)
            [ -n "$TUNNEL_URL" ] && break
            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            sleep 15
            TUNNEL_URL=$(grep -oP 'https://[a-zA-Z0-9\-]+\.trycloudflare\.com' \
              /tmp/cloudflared.log 2>/dev/null | head -1)
          fi
          [ -z "$TUNNEL_URL" ] && cat /tmp/cloudflared.log && exit 1

          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV

          # Update APP_URL
          sudo sed -i "s|APP_URL=.*|APP_URL=$TUNNEL_URL|" /var/www/pterodactyl/.env
          cd /var/www/pterodactyl
          sudo php artisan config:cache
          sudo php artisan view:cache
          sudo chown -R www-data:www-data storage bootstrap/cache
          sudo chmod -R 775 storage bootstrap/cache
          sudo systemctl restart php8.2-fpm

          mkdir -p /tmp/panel-url
          {
            echo "PANEL_URL=$TUNNEL_URL"
            echo "BYPASS_URL=$TUNNEL_URL/go-admin"
            echo "USERNAME=${{ secrets.ADMIN_USER || 'admin' }}"
            echo "RUN_ID=${{ github.run_id }}"
            echo "STARTED_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "EXPIRES_AT=$(date -u -d '+5 hours 45 minutes' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } > /tmp/panel-url/access.txt

          echo ""
          echo "════════════════════════════════════════════"
          echo "  🌐 PANEL URL  : $TUNNEL_URL"
          echo "  🔓 BYPASS     : $TUNNEL_URL/go-admin"
          echo "  👤 USERNAME   : ${{ secrets.ADMIN_USER || 'admin' }}"
          echo "  🟢 Node.js Egg: sudah diimport otomatis"
          echo "════════════════════════════════════════════"

      # ── 13. Install Wings ─────────────────────────────────────────────────
      - name: 🦅 Install Wings
        run: |
          curl -fsSL https://github.com/pterodactyl/wings/releases/latest/download/wings_linux_amd64 \
            -o /usr/local/bin/wings
          chmod +x /usr/local/bin/wings
          wings version
          echo "✅ Wings binary installed"

      # ── 14. Setup Wings node & config ────────────────────────────────────
      - name: ⚙️ Setup Wings Node & Config
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/setup_wings.py"

      # ── 15. Start Wings ───────────────────────────────────────────────────
      - name: 🚀 Start Wings Daemon
        run: |
          sudo mkdir -p /var/lib/pterodactyl/volumes
          sudo mkdir -p /var/log/pterodactyl
          # Pre-create log file agar shell dapat redirect tanpa sudo
          sudo touch /var/log/pterodactyl/wings.log
          sudo chmod 666 /var/log/pterodactyl/wings.log

          # Start Wings — redirect SETELAH file dibuat, sehingga tidak perlu sudo untuk redirect
          nohup sudo wings --config /etc/pterodactyl/config.yml \
            >> /var/log/pterodactyl/wings.log 2>&1 &
          echo $! > /tmp/wings.pid

          echo "⏳ Waiting for Wings to start..."
          for i in $(seq 1 30); do
            CODE=$(curl -sk -o /dev/null -w "%{http_code}" http://127.0.0.1:8080 2>/dev/null || echo "000")
            if [ "$CODE" != "000" ]; then
              echo "✅ Wings responding (HTTP $CODE) — attempt $i"
              break
            fi
            echo "  Attempt $i/30 — waiting 2s..."
            sleep 2
          done

          echo "--- Wings log (last 20 lines) ---"
          tail -20 /var/log/pterodactyl/wings.log || true

      # ── 16. Auto-create Node.js Server ───────────────────────────────────
      - name: 🟢 Auto-Create Node.js Server
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/create_server.py"

      # ── 17. Finalize Server (skip install, mark installed) ────────────────
      - name: ✅ Finalize Server — Mark Installed
        run: |
          # Ambil UUID server dari DB
          SRV_UUID=$(sudo mysql -u root panel -se \
            "SELECT uuid FROM servers ORDER BY id DESC LIMIT 1;" 2>/dev/null)

          if [ -z "$SRV_UUID" ]; then
            echo "⚠ No server found — skip finalize"
            exit 0
          fi
          echo "Server UUID: $SRV_UUID"

          # Buat volume directory agar Wings tidak perlu pull image install
          VOL_DIR="/var/lib/pterodactyl/volumes/${SRV_UUID}"
          sudo mkdir -p "$VOL_DIR"
          sudo chmod 777 "$VOL_DIR"

          # Buat index.js placeholder agar server bisa langsung start
          sudo tee "$VOL_DIR/index.js" > /dev/null <<'JS'
const http = require('http');
const PORT = process.env.PORT || 3000;
http.createServer((req, res) => {
  res.writeHead(200, {'Content-Type': 'text/plain'});
  res.end('Hello from Pterodactyl Node.js Server!\n');
}).listen(PORT, () => console.log(`Listening on port ${PORT}`));
JS
          echo "✅ index.js placeholder dibuat di $VOL_DIR"

          # Force-set server ke status installed via DB
          # Pterodactyl v1.x: status=NULL artinya installed, installed=1
          sudo mysql -u root panel -e \
            "UPDATE servers SET status=NULL, installed=1, skip_scripts=1 WHERE uuid='${SRV_UUID}';" \
            2>/dev/null || \
          sudo mysql -u root panel -e \
            "UPDATE servers SET installed=1, skip_scripts=1 WHERE uuid='${SRV_UUID}';"

          echo "✅ Server marked as installed (status=NULL)"

          # Clear panel cache agar status ter-refresh
          cd /var/www/pterodactyl
          sudo php artisan cache:clear -q 2>/dev/null || true
          echo "✅ Panel cache cleared"

      # ── 19. Upload artifact ───────────────────────────────────────────────
      - name: 📤 Upload Panel URL
        uses: actions/upload-artifact@v4
        with:
          name: panel-access-info
          path: /tmp/panel-url/access.txt
          retention-days: 1
          overwrite: true

      # ── 18. Summary ───────────────────────────────────────────────────────
      - name: 📋 Access Info
        run: |
          echo "## 🦕 Pterodactyl Panel — LIVE ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Info | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 **Panel URL** | [$TUNNEL_URL]($TUNNEL_URL) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔓 **Login tanpa password** | [$TUNNEL_URL/go-admin]($TUNNEL_URL/go-admin) |" >> $GITHUB_STEP_SUMMARY
          echo "| 👤 Username | \`${{ secrets.ADMIN_USER || 'admin' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔑 Password | *(secret ADMIN_PASS)* |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟢 Node.js Egg | ✅ Auto-imported (nodejs_22/20/18/16) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🦅 Wings | ✅ Running (port 8080) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🖥️ Server | ✅ Node.js App auto-created (port $SERVER_PORT) |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏰ Aktif hingga | ~5 jam 45 menit |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Akses cepat:** klik link *Login tanpa password* untuk langsung masuk tanpa perlu username/password." >> $GITHUB_STEP_SUMMARY
          echo "> URL berubah setiap restart. Selalu cek tab **Summary** untuk URL terbaru." >> $GITHUB_STEP_SUMMARY

      # ── 19. Keep alive ────────────────────────────────────────────────────
      - name: ♾️ Keep Panel Running (~5h 45m)
        run: |
          echo "✅ Panel live: $TUNNEL_URL"
          END=$((SECONDS + 20700))
          COUNT=0
          while [ $SECONDS -lt $END ]; do
            sleep 300
            COUNT=$((COUNT + 1))
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" \
              http://localhost/auth/login --max-time 5 || echo "000")
            echo "[$COUNT] Heartbeat — HTTP $STATUS — $TUNNEL_URL"
          done
          echo "⏰ Session ending..."

      # ── 20. Save state ────────────────────────────────────────────────────
      - name: 💾 Save Panel State
        if: always()
        run: |
          mkdir -p /tmp/panel-state
          sudo mysqldump -u root panel 2>/dev/null \
            | gzip > /tmp/panel-state/db.sql.gz \
            && echo "✅ DB saved ($(du -sh /tmp/panel-state/db.sql.gz | cut -f1))" \
            || echo "⚠️ DB dump failed"
          sudo cp /var/www/pterodactyl/.env /tmp/panel-state/.env 2>/dev/null || true

      - name: 📦 Cache Panel State
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/panel-state/db.sql.gz
            /tmp/panel-state/.env
            /tmp/panel-state/app_key.txt
          key: pterodactyl-panel-state-v1-${{ github.run_number }}
