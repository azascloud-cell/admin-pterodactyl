name: 🦕 Run Pterodactyl Panel (No VPS)

on:
  # ── Jadwal: restart otomatis setiap 5 jam ─────────────────────────────────
  schedule:
    - cron: '0 */5 * * *'

  # ── Manual / Ping eksternal ────────────────────────────────────────────────
  workflow_dispatch:
    inputs:
      fresh_install:
        description: 'Reset database (fresh install)?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

  repository_dispatch:
    types: [start-panel, keepalive-ping, ping]

jobs:
  run-panel:
    name: 🖥️ Run Panel on GitHub Runner
    runs-on: ubuntu-22.04
    timeout-minutes: 350   # ~5 jam 50 menit (batas GitHub = 6 jam)

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: 📦 Checkout
        uses: actions/checkout@v4

      # ── 2. Restore state DB & .env dari cache ────────────────────────────
      - name: 🗄️ Restore Panel State (DB + env)
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/panel-state/db.sql.gz
            /tmp/panel-state/.env
            /tmp/panel-state/app_key.txt
          key: pterodactyl-panel-state-v1
          restore-keys: pterodactyl-panel-state-

      - name: 📋 Check state
        run: |
          FRESH="${{ github.event.inputs.fresh_install || 'false' }}"
          if [ -f /tmp/panel-state/db.sql.gz ] && [ "$FRESH" != "true" ]; then
            echo "STATE=restore" >> $GITHUB_ENV
            echo "✅ Previous state found — restoring database"
          else
            echo "STATE=fresh" >> $GITHUB_ENV
            echo "🆕 No previous state — fresh installation"
          fi
          mkdir -p /tmp/panel-state

      # ── 3. Install sistem dependencies (cached) ───────────────────────────
      - name: ⚡ Install System Packages
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq

          # Tambah Ondrej PHP PPA untuk PHP 8.2
          sudo apt-get install -y -qq software-properties-common
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            nginx mariadb-server redis-server supervisor \
            php8.2 php8.2-cli php8.2-gd php8.2-mysql php8.2-pdo \
            php8.2-mbstring php8.2-tokenizer php8.2-bcmath \
            php8.2-xml php8.2-fpm php8.2-curl php8.2-zip \
            curl wget unzip cron 2>&1 | tail -10

          # Install Composer
          curl -sS https://getcomposer.org/installer | sudo php -- --install-dir=/usr/local/bin --filename=composer
          composer --version
          echo "✅ Packages installed (PHP $(php8.2 --version | head -1))"

      # ── 4. Konfigurasi MariaDB ─────────────────────────────────────────────
      - name: 🗃️ Configure MariaDB
        run: |
          sudo systemctl start mariadb
          sudo mysql -u root <<SQL
          CREATE DATABASE IF NOT EXISTS panel CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE USER IF NOT EXISTS 'pterodactyl'@'127.0.0.1' IDENTIFIED BY '${{ secrets.DB_PASSWORD }}';
          GRANT ALL PRIVILEGES ON panel.* TO 'pterodactyl'@'127.0.0.1';
          FLUSH PRIVILEGES;
          SQL
          echo "✅ Database configured"

      # ── 5. Download & setup Pterodactyl Panel ────────────────────────────
      - name: 🦕 Setup Pterodactyl Panel
        run: |
          sudo mkdir -p /var/www/pterodactyl
          cd /var/www/pterodactyl

          # Download panel
          LATEST=$(curl -s https://api.github.com/repos/pterodactyl/panel/releases/latest \
            | grep browser_download_url | grep panel.tar.gz | cut -d'"' -f4)
          sudo curl -Lo panel.tar.gz "$LATEST"
          sudo tar -xzf panel.tar.gz
          sudo rm panel.tar.gz
          sudo chmod -R 755 storage bootstrap/cache

          # Composer
          sudo COMPOSER_ALLOW_SUPERUSER=1 composer install \
            --no-dev --optimize-autoloader --no-interaction -q
          echo "✅ Panel files ready"

      # ── 6. Konfigurasi .env (restore atau fresh) ─────────────────────────
      - name: ⚙️ Configure Environment
        run: |
          cd /var/www/pterodactyl

          if [ "$STATE" = "restore" ] && [ -f /tmp/panel-state/.env ]; then
            echo "📂 Restoring .env from cache..."
            sudo cp /tmp/panel-state/.env .env
          else
            echo "🆕 Creating fresh .env..."
            sudo cp .env.example .env
            sudo php artisan key:generate --force

            # Simpan app key
            APP_KEY=$(grep '^APP_KEY=' .env | cut -d'=' -f2-)
            mkdir -p /tmp/panel-state
            echo "$APP_KEY" > /tmp/panel-state/app_key.txt
          fi

          # Update .env values
          sudo sed -i "s|APP_URL=.*|APP_URL=http://localhost|"           .env
          sudo sed -i "s|APP_ENVIRONMENT=.*|APP_ENVIRONMENT=production|" .env
          sudo sed -i "s|APP_DEBUG=.*|APP_DEBUG=false|"                  .env
          sudo sed -i "s|DB_HOST=.*|DB_HOST=127.0.0.1|"                  .env
          sudo sed -i "s|DB_DATABASE=.*|DB_DATABASE=panel|"              .env
          sudo sed -i "s|DB_USERNAME=.*|DB_USERNAME=pterodactyl|"        .env
          sudo sed -i "s|DB_PASSWORD=.*|DB_PASSWORD=${{ secrets.DB_PASSWORD }}|" .env
          # Gunakan file driver — lebih stabil di GitHub runner (tidak bergantung Redis)
          sudo sed -i "s|CACHE_DRIVER=.*|CACHE_DRIVER=file|"              .env
          sudo sed -i "s|SESSION_DRIVER=.*|SESSION_DRIVER=file|"          .env
          sudo sed -i "s|QUEUE_CONNECTION=.*|QUEUE_CONNECTION=sync|"      .env
          # Trusted proxies: wajib saat di belakang Cloudflare tunnel (reverse proxy)
          # Tanpa ini, CSRF & session cookie gagal karena X-Forwarded-Proto tidak dipercaya
          grep -q '^TRUSTED_PROXIES=' .env \
            && sudo sed -i "s|TRUSTED_PROXIES=.*|TRUSTED_PROXIES=*|" .env \
            || echo "TRUSTED_PROXIES=*" | sudo tee -a .env
          # Session cookie tidak perlu secure flag (nginx receive HTTP dari cloudflared)
          grep -q '^SESSION_SECURE_COOKIE=' .env \
            && sudo sed -i "s|SESSION_SECURE_COOKIE=.*|SESSION_SECURE_COOKIE=false|" .env \
            || echo "SESSION_SECURE_COOKIE=false" | sudo tee -a .env
          # Disable reCAPTCHA — tidak ada kunci valid di environment ini,
          # server-side validation akan gagal dan menyebabkan "unexpected error" saat login
          grep -q '^RECAPTCHA_ENABLED=' .env \
            && sudo sed -i "s|RECAPTCHA_ENABLED=.*|RECAPTCHA_ENABLED=false|" .env \
            || echo "RECAPTCHA_ENABLED=false" | sudo tee -a .env
          echo "✅ .env configured"

      # ── 7. Database: restore atau migrate ────────────────────────────────
      - name: 🗄️ Setup Database
        run: |
          cd /var/www/pterodactyl

          if [ "$STATE" = "restore" ] && [ -f /tmp/panel-state/db.sql.gz ]; then
            echo "📂 Restoring database from cache..."
            zcat /tmp/panel-state/db.sql.gz | sudo mysql -u root panel
            echo "✅ Database restored"
            # Selalu jalankan migrate setelah restore — panel selalu download versi latest,
            # skema DB dari cache mungkin sudah ketinggalan migration terbaru
            echo "🔄 Running pending migrations on restored DB..."
            sudo php artisan migrate --force -q
            echo "✅ Migrations applied"
          else
            echo "🆕 Running fresh migrations..."
            sudo php artisan migrate --seed --force -q
            echo "✅ Fresh migrations done"
          fi

          # ── Sync admin user via Python subprocess (no shell $ expansion) ──────
          # Masalah sebelumnya: bcrypt hash mengandung $ yang bocor di shell.
          # Solusi: Python subprocess.run() pass argumen sebagai list —
          # tidak ada shell expansion sama sekali.
          python3 << 'PYEOF'
import subprocess, sys

# 1. Generate bcrypt hash via PHP (captured as plain string)
r = subprocess.run(
    ['php8.2', '-r', "echo password_hash('admin', PASSWORD_BCRYPT);"],
    capture_output=True, text=True)
h = r.stdout.strip()
if not h.startswith('$2'):
    print('ERROR: hash generation failed:', r.stderr)
    sys.exit(1)
print(f'Hash generated: {h[:10]}...')

# 2. Cek users yang ada
r2 = subprocess.run(
    ['sudo', 'mysql', '-u', 'root', 'panel', '-e',
     'SELECT id, username, email FROM users;'],
    capture_output=True, text=True)
print('Current users:\n' + (r2.stdout.strip() or '(none)'))

# 3. Update atau insert admin user
# UPDATE dulu — kalau 0 rows, INSERT
update_sql = (
    "UPDATE users SET username='admin', password='{}', root_admin=1 "
    "WHERE 1=1 LIMIT 1;".format(h)
)
r3 = subprocess.run(
    ['sudo', 'mysql', '-u', 'root', 'panel', '-e', update_sql],
    capture_output=True, text=True)
print('UPDATE:', r3.returncode, r3.stderr.strip() or 'OK')

# Cek apakah ada user sekarang
r4 = subprocess.run(
    ['sudo', 'mysql', '-u', 'root', 'panel', '-se',
     "SELECT COUNT(*) FROM users;"],
    capture_output=True, text=True)
count = int(r4.stdout.strip() or '0')

if count == 0:
    # Tidak ada user sama sekali — INSERT fresh
    import uuid as uuidlib
    new_uuid = str(uuidlib.uuid4())
    insert_sql = (
        "INSERT INTO users "
        "(uuid, username, email, name_first, name_last, password, language, root_admin, use_totp, created_at, updated_at) "
        "VALUES ('{}', 'admin', 'admin@pterodactyl.local', 'Admin', 'User', '{}', 'en', 1, 0, NOW(), NOW());".format(new_uuid, h)
    )
    r5 = subprocess.run(
        ['sudo', 'mysql', '-u', 'root', 'panel', '-e', insert_sql],
        capture_output=True, text=True)
    print('INSERT:', r5.returncode, r5.stderr.strip() or 'OK')

# 4. Verifikasi akhir
r6 = subprocess.run(
    ['sudo', 'mysql', '-u', 'root', 'panel', '-e',
     "SELECT id, username, email, root_admin, LEFT(password,10) AS pwd FROM users;"],
    capture_output=True, text=True)
print('Final state:\n' + r6.stdout.strip())
PYEOF

      # ── 8. File permissions & services ────────────────────────────────────
      - name: 🔧 Start Services
        run: |
          cd /var/www/pterodactyl
          sudo chown -R www-data:www-data /var/www/pterodactyl/
          sudo chmod -R 755 storage bootstrap/cache

          # Supervisor (queue worker)
          sudo tee /etc/supervisor/conf.d/ptero.conf > /dev/null <<CONF
          [program:ptero-worker]
          process_name=%(program_name)s_%(process_num)02d
          command=php /var/www/pterodactyl/artisan queue:work --sleep=3 --tries=3 --max-time=3600
          autostart=true
          autorestart=true
          user=www-data
          numprocs=2
          redirect_stderr=true
          stdout_logfile=/var/log/supervisor/ptero.log
          CONF

          sudo supervisorctl reread && sudo supervisorctl update
          sudo supervisorctl start ptero-worker:* 2>/dev/null || true

          # Cron
          echo "* * * * * www-data php /var/www/pterodactyl/artisan schedule:run" \
            | sudo tee /etc/cron.d/pterodactyl
          sudo systemctl restart cron

          # PHP-FPM & Redis
          sudo systemctl restart php8.2-fpm redis-server
          echo "✅ Services started"

      # ── 9. Nginx tanpa SSL (tunnel handle SSL) ────────────────────────────
      - name: 🌐 Configure Nginx
        run: |
          sudo tee /etc/nginx/sites-available/pterodactyl > /dev/null <<NGINX
          server {
              listen 80 default_server;
              server_name _;
              root /var/www/pterodactyl/public;
              index index.php;
              client_max_body_size 100m;
              add_header X-Frame-Options SAMEORIGIN;

              location / {
                  try_files \$uri \$uri/ /index.php?\$query_string;
              }

              location ~ \.php$ {
                  fastcgi_split_path_info ^(.+\.php)(/.+)$;
                  fastcgi_pass unix:/run/php/php8.2-fpm.sock;
                  fastcgi_index index.php;
                  include fastcgi_params;
                  fastcgi_param SCRIPT_FILENAME \$document_root\$fastcgi_script_name;
                  fastcgi_param HTTP_PROXY "";
                  # Cloudflare Tunnel terminates SSL → nginx receives plain HTTP.
                  # Tell PHP the original connection was HTTPS so Laravel's
                  # TrustProxies middleware sets the correct scheme for CSRF & sessions.
                  fastcgi_param HTTPS on;
                  fastcgi_param HTTP_X_FORWARDED_PROTO https;
              }

              location ~ /\.ht { deny all; }
          }
          NGINX

          sudo ln -sf /etc/nginx/sites-available/pterodactyl \
                      /etc/nginx/sites-enabled/pterodactyl
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t && sudo systemctl restart nginx
          echo "✅ Nginx running on port 80"

      # ── 10. Cloudflare Tunnel (expose ke internet) ────────────────────────
      - name: 🌍 Start Cloudflare Tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

          # Start tunnel background
          cloudflared tunnel --url http://localhost:80 --no-autoupdate \
            2>/tmp/cloudflared.log &

          echo "⏳ Waiting for tunnel URL (up to 60s)..."
          for i in $(seq 1 30); do
            TUNNEL_URL=$(grep -oP 'https://[a-zA-Z0-9\-]+\.trycloudflare\.com' \
              /tmp/cloudflared.log 2>/dev/null | head -1)
            [ -n "$TUNNEL_URL" ] && break
            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "⚠️ Retrying with longer wait..."
            sleep 15
            TUNNEL_URL=$(grep -oP 'https://[a-zA-Z0-9\-]+\.trycloudflare\.com' \
              /tmp/cloudflared.log 2>/dev/null | head -1)
          fi

          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Could not get tunnel URL. Cloudflared log:"
            cat /tmp/cloudflared.log
            exit 1
          fi

          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
          echo ""
          echo "════════════════════════════════════════════"
          echo "  🌐 PANEL URL : $TUNNEL_URL"
          echo "  👤 USERNAME  : ${{ secrets.ADMIN_USER || 'admin' }}"
          echo "  🔑 PASSWORD  : (lihat secret ADMIN_PASS)"
          echo "════════════════════════════════════════════"

          # ── Update APP_URL ke tunnel URL agar CSRF/session cocok ────────────
          echo "🔧 Updating APP_URL to $TUNNEL_URL..."
          sudo sed -i "s|APP_URL=.*|APP_URL=$TUNNEL_URL|" /var/www/pterodactyl/.env

          # Rebuild config cache dengan APP_URL yang sudah benar
          # (route:cache TIDAK dipakai — Pterodactyl tidak support route caching)
          cd /var/www/pterodactyl
          sudo php artisan config:cache
          sudo php artisan view:cache

          # Pastikan permissions storage OK untuk session file driver
          sudo chown -R www-data:www-data storage bootstrap/cache
          sudo chmod -R 775 storage bootstrap/cache

          # Restart PHP-FPM agar config baru terbaca
          sudo systemctl restart php8.2-fpm
          echo "✅ APP_URL=$TUNNEL_URL — config cached & services restarted"

          # Tulis ke file untuk artifact
          mkdir -p /tmp/panel-url
          {
            echo "PANEL_URL=$TUNNEL_URL"
            echo "USERNAME=${{ secrets.ADMIN_USER || 'admin' }}"
            echo "RUN_ID=${{ github.run_id }}"
            echo "RUN_NUMBER=${{ github.run_number }}"
            echo "STARTED_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "EXPIRES_AT=$(date -u -d '+5 hours 45 minutes' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } > /tmp/panel-url/access.txt
          cat /tmp/panel-url/access.txt

      # ── 11. Upload URL sebagai artifact (bisa dibaca saat job masih running) ─
      - name: 📤 Upload Panel URL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: panel-access-info
          path: /tmp/panel-url/access.txt
          retention-days: 1
          overwrite: true

      # ── 12. Print akses info ke summary ──────────────────────────────────
      - name: 📋 Access Information
        run: |
          echo "## 🦕 Pterodactyl Panel — LIVE ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Info | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 **Panel URL** | [$TUNNEL_URL]($TUNNEL_URL) |" >> $GITHUB_STEP_SUMMARY
          echo "| 👤 Username | \`${{ secrets.ADMIN_USER || 'admin' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔑 Password | *(secret ADMIN_PASS)* |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏰ Aktif hingga | ~5 jam 45 menit dari sekarang |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> URL berubah setiap restart — selalu cek Summary untuk URL terbaru." >> $GITHUB_STEP_SUMMARY

      # ── 13. Keep alive: panel jalan selama sisa waktu ─────────────────────
      - name: ♾️ Keep Panel Running (~5h 45m)
        run: |
          echo "✅ Panel live: $TUNNEL_URL"
          END=$((SECONDS + 20700))
          COUNT=0
          while [ $SECONDS -lt $END ]; do
            sleep 300
            COUNT=$((COUNT + 1))
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" \
              http://localhost/auth/login --max-time 5 || echo "000")
            echo "[$COUNT] Heartbeat — HTTP $STATUS — $TUNNEL_URL"
          done
          echo "⏰ Session ending — saving state..."

      # ── 14. Simpan state DB sebelum workflow berakhir ─────────────────────
      - name: 💾 Save Panel State
        if: always()
        run: |
          mkdir -p /tmp/panel-state
          sudo mysqldump -u root panel 2>/dev/null | gzip > /tmp/panel-state/db.sql.gz \
            && echo "✅ DB saved ($(du -sh /tmp/panel-state/db.sql.gz | cut -f1))" \
            || echo "⚠️ DB dump failed"
          sudo cp /var/www/pterodactyl/.env /tmp/panel-state/.env 2>/dev/null || true

      - name: 📦 Cache Panel State
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/panel-state/db.sql.gz
            /tmp/panel-state/.env
            /tmp/panel-state/app_key.txt
          key: pterodactyl-panel-state-v1-${{ github.run_number }}
